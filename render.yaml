"use client";

import { useState } from "react";

type IconProps = { size?: number };
function MailIcon({ size = 18 }: IconProps) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" strokeWidth="2"/><path d="m4 7 8 6 8-6" stroke="currentColor" strokeWidth="2" strokeLinejoin="round"/></svg>; }
function LockIcon({ size = 18 }: IconProps) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" strokeWidth="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="currentColor" strokeWidth="2"/></svg>; }
function EyeIcon({ size = 18, crossed = false }: IconProps & { crossed?: boolean }) { return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" strokeWidth="2"/><circle cx="12" cy="12" r="2.5" stroke="currentColor" strokeWidth="2"/>{crossed && <path d="M4 4l16 16" stroke="currentColor" strokeWidth="2"/>}</svg>; }

export function Login({ onLogin }: { onLogin: (email: string, password: string) => boolean }) {
  const [email, setEmail] = useState("admin@ria.local");
  const [password, setPassword] = useState("Admin123!");
  const [show, setShow] = useState(false);
  const [error, setError] = useState("");
  return <main className="login-page"><div className="login-glow" /><section className="login-card"><div className="login-logo"><svg width="86" height="86" viewBox="0 0 64 64" fill="none"><path d="M22 8h20v8H22z" fill="currentColor"/><path d="M27 16h10v12l8 10v5H19v-5l8-10V16z" stroke="currentColor" strokeWidth="4" strokeLinejoin="round"/><path d="M14 44h36M20 50h24M26 56h12" stroke="currentColor" strokeWidth="4" strokeLinecap="round"/><circle cx="32" cy="31" r="3" fill="#ef4444"/></svg></div><form onSubmit={(e) => { e.preventDefault(); const ok = onLogin(email, password); setError(ok ? "" : "Identifiants incorrects ou compte désactivé."); }}><label>Adresse e-mail<div className="input-with-icon"><MailIcon /><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} autoComplete="email" /></div></label><label>Mot de passe<div className="input-with-icon"><LockIcon /><input type={show ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" /><button type="button" onClick={() => setShow(!show)}>{show ? <EyeIcon crossed /> : <EyeIcon />}</button></div></label>{error && <p className="form-error">{error}</p>}<button className="login-button" type="submit">Se connecter</button></form><p className="demo-note">Compte de démonstration prérempli</p></section></main>;
}
